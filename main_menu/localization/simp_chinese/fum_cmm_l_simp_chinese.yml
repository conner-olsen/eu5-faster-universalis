 fum__character_culling_name: "启用角色移除"
 fum__character_culling_desc: "定期从各国移除属性最低的成年角色以提升性能。儿童、王室领地角色、内阁成员、将领、海军提督以及拥有特殊特质的角色将受到保护。"
 fum__max_characters_per_nation_name: "每个国家的最大人物数"
 fum__max_characters_per_nation_desc: "每个国家可拥有的成年人物最大数量。多出的属性最低的成年人将每 4 年移除一次。"
 fum__max_characters_per_nation_format: "[CMMV('fum__max_characters_per_nation')]"
 fum__character_culling: "fum__character_culling"
 fum__max_characters_per_nation: "fum__max_characters_per_nation"
 fum__common_name: "常规"
 fum__common__removals_name: "移除"
 fum__sop_removal_text: "应用"
 fum__common__character_culling_name: "人物移除"
 fum__world_reduction_name: "世界精简"
 fum__world_reduction__general_name: "常规"
 fum__reduction_preset_name: "预设"
 fum__reduction_preset_desc: "勾选下方的一组选项。更改其中任何一项都会将其切换为自定义。"
 fum__reduction_preset_option_1_name: "自定义"
 fum__reduction_preset_option_1_desc: "关闭所有选项。"
 fum__reduction_preset_option_2_name: "低影响"
 fum__reduction_preset_option_2_desc: "移除$north_america$、$south_america$、$australasia$、$pacific_islands$、$central_africa$和$southern_africa$等国家并合并其人口。合并$north_asia$、$west_africa$和$east_africa$的人口。"
 fum__reduction_preset_option_3_name: "以欧洲为中心"
 fum__reduction_preset_option_3_desc: "移除 $east_asia$、$south_asia$、$south_east_asia$、$australasia$ 和 $pacific_islands$ 的国家与人口，并禁止在当地进行殖民。移除 $north_asia$ 的国家与人口。移除 $north_america$、$south_america$、$central_africa$ 和 $southern_africa$ 的国家并合并其人口。合并 $west_africa$ 和 $east_africa$ 的人口。"
 fum__reduction_preset_option_4_name: "以亚洲为中心"
 fum__reduction_preset_option_4_desc: "移除$western_europe$、$eastern_europe$、$north_america$和$south_america$的国家与人口，并禁止在当地进行殖民。移除$north_africa$、$west_africa$和$central_africa$的国家并合并其人口。"
 fum__apply_world_reduction_name: "应用世界缩减"
 fum__apply_world_reduction_desc: "将每个已勾选的选项应用到其所属次大陆。$caucasus_region$、$steppes_region$ 和 $egypt_region$ 区域将始终保留。"
 fum__apply_world_reduction_text: "应用"
 fum_txt_subcontinent: "次大陆"
 fum_txt_remove_countries_name: "移除国家"
 fum_txt_remove_countries_desc: "移除该次大陆上的所有国家。它们的单位和建筑将被摧毁，土地将变为无主之地。在任何地方移除国家都会终结大瘟疫，且同时移除 $east_asia$ 与 $south_asia$ 的国家将从1390年起，向与其接壤的你的所在地传播精英政治。"
 fum_txt_merge_pops_name: "合并人口"
 fum_txt_merge_pops_desc: "将该次大陆各区域内的所有人口转换为该区域内规模最大的文化与宗教。首都在该区域内的国家及其所有角色也将随之转换。人口数量保持不变。"
 fum_txt_remove_pops_name: "移除人口"
 fum_txt_remove_pops_desc: "按照上述方式合并人口，随后将每个地点变为仅有 10 人的未开发农村定居点。"
 fum_txt_block_colonization_name: "禁止殖民"
 fum_txt_block_colonization_desc: "禁止在该次大陆的任何地方进行殖民，并阻止其所在地增长或吸引移民。"
