 fum__performance__character_culling_name: "角色剔除"
 fum__character_culling_name: "启用角色剔除"
 fum__character_culling_desc: "定期从每个国家中移除属性最低的成年角色以提升性能。儿童、王室成员、内阁大臣、陆军将领、海军将领以及拥有特殊特质的角色将受到保护。"
 fum__max_characters_per_nation_name: "每个国家的最大人物数"
 fum__max_characters_per_nation_desc: "每个国家可以拥有的成年人物最大数量。每隔4年，系统会移除属性最低的多余成年人。孩童不受此限制。"
 fum__max_characters_per_nation_format: "[CMMV('fum__max_characters_per_nation')]"
 fum__performance__character_culling: "fum__performance__character_culling"
 fum__character_culling: "fum__character_culling"
