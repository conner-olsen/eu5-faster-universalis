 fum__performance__character_culling_name: "Descarte de Personagens"
 fum__character_culling_name: "Ativar Descarte de Personagens"
 fum__character_culling_desc: "Remove periodicamente os personagens adultos com os atributos mais baixos de cada nação para melhorar o desempenho. Crianças, personagens na propriedade da coroa, ministros do gabinete, generais, almirantes e aqueles com características especiais estão protegidos."
 fum__max_characters_per_nation_name: "Máximo de Personagens por Nação"
 fum__max_characters_per_nation_desc: "O número máximo de personagens adultos que cada nação pode ter. Adultos excedentes com os atributos mais baixos são removidos a cada 4 anos. Crianças estão isentas."
 fum__max_characters_per_nation_format: "[CMMV('fum__max_characters_per_nation')]"
 fum__performance__character_culling: "fum__performance__character_culling"
 fum__character_culling: "fum__character_culling"
