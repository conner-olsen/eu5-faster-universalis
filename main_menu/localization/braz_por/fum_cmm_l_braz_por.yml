 fum__character_culling_name: "Ativar Remoção de Personagens"
 fum__character_culling_desc: "Remove periodicamente os personagens adultos com os menores atributos de cada nação para melhorar o desempenho. Crianças, personagens no patrimônio da coroa, membros do gabinete, generais, almirantes e aqueles com traços especiais são protegidos."
 fum__max_characters_per_nation_name: "Máximo de Personagens por Nação"
 fum__max_characters_per_nation_desc: "O número máximo de personagens adultos que cada nação pode ter. Adultos excedentes com os menores atributos são removidos a cada 4 anos."
 fum__max_characters_per_nation_format: "[CMMV('fum__max_characters_per_nation')]"
 fum__character_culling: "fum__character_culling"
 fum__max_characters_per_nation: "fum__max_characters_per_nation"
 fum__common_name: "Comum"
 fum__common__removals_name: "Remoções"
 fum__sop_removal_text: "Aplicar"
 fum__common__character_culling_name: "Remoção de Personagens"
 fum__world_reduction_name: "Redução de Mundo"
 fum__world_reduction__general_name: "Geral"
 fum__reduction_preset_name: "Predefinição"
 fum__reduction_preset_desc: "Marca um conjunto de opções abaixo. Alterar qualquer uma delas muda isso para Personalizado."
 fum__reduction_preset_option_1_name: "Personalizado"
 fum__reduction_preset_option_1_desc: "Desativa todas as opções."
 fum__reduction_preset_option_2_name: "Baixo Impacto"
 fum__reduction_preset_option_2_desc: "Remove os países de $north_america$, $south_america$, $australasia$, $pacific_islands$, $central_africa$ e $southern_africa$ e mescla seus pops. Mescla os pops de $north_asia$, $west_africa$ e $east_africa$."
 fum__reduction_preset_option_3_name: "Centrado na Europa"
 fum__reduction_preset_option_3_desc: "Remove os países e pops de $east_asia$, $south_asia$, $south_east_asia$, $australasia$ e $pacific_islands$ e bloqueia a colonização nesses locais. Remove os países e pops de $north_asia$. Remove os países de $north_america$, $south_america$, $central_africa$ e $southern_africa$ e funde suas pops. Funde as pops de $west_africa$ e $east_africa$."
 fum__reduction_preset_option_4_name: "Centrado na Ásia"
 fum__reduction_preset_option_4_desc: "Remove os países e pops de $western_europe$, $eastern_europe$, $north_america$ e $south_america$ e bloqueia a colonização ali. Remove os países de $north_africa$, $west_africa$ e $central_africa$ e mescla suas pops."
 fum__apply_world_reduction_name: "Aplicar Redução do Mundo"
 fum__apply_world_reduction_desc: "Aplica cada opção marcada ao seu subcontinente. As regiões $caucasus_region$, $steppes_region$ e $egypt_region$ são sempre mantidas."
 fum__apply_world_reduction_text: "Aplicar"
 fum_txt_subcontinent: "Subcontinente"
 fum_txt_remove_countries_name: "Remover Países"
 fum_txt_remove_countries_desc: "Remove todos os países no subcontinente. Suas unidades e construções são destruídas e suas terras tornam-se sem dono. Remover países em qualquer lugar encerra a Grande Pestilência, e remover os de ambos $east_asia$ e $south_asia$ espalha Meritocracia para seus locais que fazem fronteira com eles a partir de 1390."
 fum_txt_merge_pops_name: "Mesclar Pops"
 fum_txt_merge_pops_desc: "Converte cada pop em cada uma das regiões do subcontinente para a cultura e religião majoritárias da região. Países com capital na região, e todos os seus personagens, são convertidos junto com elas. A população permanece inalterada."
 fum_txt_remove_pops_name: "Remover Pops"
 fum_txt_remove_pops_desc: "Mescla as pops como acima e deixa cada localidade como um Assentamento Rural não desenvolvido de 10 pessoas."
 fum_txt_block_colonization_name: "Bloquear Colonização"
 fum_txt_block_colonization_desc: "Impede a colonização em qualquer lugar do subcontinente e impede que suas localizações cresçam ou atraiam migrantes."
