 fum__character_culling_name: "Habilitar eliminación de personajes"
 fum__character_culling_desc: "Elimina periódicamente a los personajes adultos con las estadísticas más bajas de cada nación para mejorar el rendimiento. Los niños, los personajes del patrimonio de la corona, los miembros del gabinete, los generales, los almirantes y aquellos con rasgos especiales están protegidos."
 fum__max_characters_per_nation_name: "Máximo de personajes por nación"
 fum__max_characters_per_nation_desc: "El número máximo de personajes adultos que cada nación puede tener. Los adultos excedentes con los atributos más bajos se eliminan cada 4 años."
 fum__max_characters_per_nation_format: "[CMMV('fum__max_characters_per_nation')]"
 fum__character_culling: "fum__character_culling"
 fum__max_characters_per_nation: "fum__max_characters_per_nation"
 fum__common_name: "Común"
 fum__common__removals_name: "Eliminaciones"
 fum__sop_removal_text: "Aplicar"
 fum__common__character_culling_name: "Eliminación de personajes"
 fum__world_reduction_name: "Reducción del mundo"
 fum__world_reduction__general_name: "General"
 fum__reduction_preset_name: "Preajuste"
 fum__reduction_preset_desc: "Marca un conjunto de opciones a continuación. Al cambiar cualquiera de ellas, esto cambiará a Personalizado."
 fum__reduction_preset_option_1_name: "Personalizado"
 fum__reduction_preset_option_1_desc: "Desactiva todas las opciones."
 fum__reduction_preset_option_2_name: "Bajo impacto"
 fum__reduction_preset_option_2_desc: "Elimina los países de $north_america$, $south_america$, $australasia$, $pacific_islands$, $central_africa$ y $southern_africa$ y fusiona su población. Fusiona la población de $north_asia$, $west_africa$ y $east_africa$."
 fum__reduction_preset_option_3_name: "Centrado en Europa"
 fum__reduction_preset_option_3_desc: "Elimina los países y poblaciones de $east_asia$, $south_asia$, $south_east_asia$, $australasia$ y $pacific_islands$ y bloquea la colonización allí. Elimina los países y poblaciones de $north_asia$. Elimina los países de $north_america$, $south_america$, $central_africa$ y $southern_africa$ y fusiona sus poblaciones. Fusiona las poblaciones de $west_africa$ y $east_africa$."
 fum__reduction_preset_option_4_name: "Centrado en Asia"
 fum__reduction_preset_option_4_desc: "Elimina los países y las poblaciones de $western_europe$, $eastern_europe$, $north_america$ y $south_america$ y bloquea la colonización allí. Elimina los países de $north_africa$, $west_africa$ y $central_africa$ y fusiona sus poblaciones."
 fum__apply_world_reduction_name: "Aplicar reducción de mundo"
 fum__apply_world_reduction_desc: "Aplica cada opción marcada a su subcontinente. Las regiones $caucasus_region$, $steppes_region$ y $egypt_region$ siempre se mantienen."
 fum__apply_world_reduction_text: "Aplicar"
 fum_txt_subcontinent: "Subcontinente"
 fum_txt_remove_countries_name: "Eliminar países"
 fum_txt_remove_countries_desc: "Elimina todos los países del subcontinente. Sus unidades y edificios son destruidos y su tierra queda sin dueño. Eliminar países en cualquier lugar pone fin a la Gran Peste, y eliminar los de tanto $east_asia$ como $south_asia$ extiende la Meritocracia a tus ubicaciones limítrofes con ellos a partir de 1390."
 fum_txt_merge_pops_name: "Fusionar poblaciones"
 fum_txt_merge_pops_desc: "Convierte a todos los pops en cada una de las regiones del subcontinente a la cultura y religión mayoritarias de la región. Los países con su capital en la región, y todos sus personajes, se convierten con ellos. El tamaño de la población no cambia."
 fum_txt_remove_pops_name: "Eliminar poblaciones"
 fum_txt_remove_pops_desc: "Fusiona las poblaciones como se indica arriba y después deja cada localización como un asentamiento rural sin desarrollar de 10 personas."
 fum_txt_block_colonization_name: "Bloquear colonización"
 fum_txt_block_colonization_desc: "Impide la colonización en cualquier lugar del subcontinente y evita que sus localizaciones crezcan o atraigan migrantes."
