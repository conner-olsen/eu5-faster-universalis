 fum__performance__character_culling_name: "Purga de personajes"
 fum__character_culling_name: "Activar descarte de personajes"
 fum__character_culling_desc: "Elimina periódicamente a los personajes adultos con las estadísticas más bajas de cada nación para mejorar el rendimiento. Los niños, personajes en el patrimonio de la corona, ministros del gabinete, generales, almirantes y aquellos con rasgos especiales están protegidos."
 fum__max_characters_per_nation_name: "Máximo de personajes por nación"
 fum__max_characters_per_nation_desc: "El número máximo de personajes adultos que puede tener cada nación. Los adultos excedentes con los atributos más bajos se eliminan cada 4 años. Los niños están exentos."
 fum__max_characters_per_nation_format: "[CMMV('fum__max_characters_per_nation')]"
 fum__performance__character_culling: "fum__performance__character_culling"
 fum__character_culling: "fum__character_culling"
