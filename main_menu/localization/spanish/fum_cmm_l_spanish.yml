 fum__navy_movement_speed: "fum__navy_movement_speed"
 fum__battle_length: "fum__battle_length"
 fum__performance__character_culling_name: "Eliminación de personajes"
 fum__character_culling_name: "Habilitar eliminación de personajes"
 fum__character_culling_desc: "Elimina periódicamente a los personajes adultos con las estadísticas más bajas de cada nación para mejorar el rendimiento. Los niños, los personajes del patrimonio de la corona, los miembros del gabinete, los generales, los almirantes y aquellos con rasgos especiales están protegidos."
 fum__max_characters_per_nation_name: "Máximo de personajes por nación"
 fum__max_characters_per_nation_desc: "El número máximo de personajes adultos que cada nación puede tener. Los adultos excedentes con los atributos más bajos se eliminan cada 4 años."
 fum__max_characters_per_nation_format: "[CMMV('fum__max_characters_per_nation')]"
 fum__performance__character_culling: "fum__performance__character_culling"
 fum__character_culling: "fum__character_culling"
 fum__max_characters_per_nation: "fum__max_characters_per_nation"
