l_english:
 # Mod
 fum_name: "Faster Universalis"
 fum_desc: "Improves EU5 performance while keeping vanilla balance, gameplay, and graphical quality."

 # Common (common) Tab
 fum__common_name: "Common"
 ## Removals (removals) Group
 fum__common__removals_name: "Removals"
 fum__sop_removal_name: "Remove Society of Pops"
 fum__sop_removal_desc: "Removes all Society of Pops."
 fum__sop_removal_text: "Apply"

 ## Character Culling (character_culling) Group
 fum__common__character_culling_name: "Character Removal"
 fum__character_culling_name: "Enable Character Removal"
 fum__character_culling_desc: "Periodically removes the lowest-stat adult characters from each nation to improve performance. Children, characters in the crown estate, Cabinet Members, generals, admirals, and those with special traits are protected."
 fum__max_characters_per_nation_name: "Max Characters Per Nation"
 fum__max_characters_per_nation_desc: "The maximum number of adult characters each nation can have. Excess adults with the lowest stats are removed every 4 years."
 fum__max_characters_per_nation_format: "[CMMV('fum__max_characters_per_nation')]"

 # World Reduction (world_reduction) Tab
 fum__world_reduction_name: "World Reduction"
 ## General (general) Group
 fum__world_reduction__general_name: "General"
 fum__reduction_preset_name: "Preset"
 fum__reduction_preset_desc: "Ticks a set of options below. Changing any of them switches this to Custom."
 fum__reduction_preset_option_1_name: "Custom"
 fum__reduction_preset_option_1_desc: "Turns every option off."
 fum__reduction_preset_option_2_name: "Low Impact"
 fum__reduction_preset_option_2_desc: "Removes the countries of $north_america$, $south_america$, $australasia$, $pacific_islands$, $central_africa$ and $southern_africa$ and merges their pops. Merges the pops of $north_asia$, $west_africa$ and $east_africa$."
 fum__reduction_preset_option_3_name: "Europe Centric"
 fum__reduction_preset_option_3_desc: "Removes the countries and pops of $east_asia$, $south_asia$, $south_east_asia$, $australasia$ and $pacific_islands$ and blocks colonization there. Removes the countries and pops of $north_asia$. Removes the countries of $north_america$, $south_america$, $central_africa$ and $southern_africa$ and merges their pops. Merges the pops of $west_africa$ and $east_africa$."
 fum__reduction_preset_option_4_name: "Asia Centric"
 fum__reduction_preset_option_4_desc: "Removes the countries and pops of $western_europe$, $eastern_europe$, $north_america$ and $south_america$ and blocks colonization there. Removes the countries of $north_africa$, $west_africa$ and $central_africa$ and merges their pops."
 fum__apply_world_reduction_name: "Apply World Reduction"
 fum__apply_world_reduction_desc: "Applies every ticked option to its subcontinent. The $caucasus_region$, $steppes_region$ and $egypt_region$ regions are always kept."
 fum__apply_world_reduction_text: "Apply"
 ## Subcontinent lists (america, oceania, asia, africa, europe)
 fum_txt_subcontinent: "Subcontinent"
 fum_txt_remove_countries_name: "Remove Countries"
 fum_txt_remove_countries_desc: "Removes every country in the subcontinent. Their units and buildings are destroyed and their land becomes unowned. Removing countries anywhere ends the Great Pestilence, and removing those of both $east_asia$ and $south_asia$ spreads Meritocracy to your locations bordering them from 1390."
 fum_txt_merge_pops_name: "Merge Pops"
 fum_txt_merge_pops_desc: "Converts every pop in each of the subcontinent's regions to the region's largest culture and religion. Countries with their capital in the region, and all of their characters, are converted with them. Population is unchanged."
 fum_txt_remove_pops_name: "Remove Pops"
 fum_txt_remove_pops_desc: "Merges pops as above, then leaves every location an undeveloped Rural Settlement of 10 people."
 fum_txt_block_colonization_name: "Block Colonization"
 fum_txt_block_colonization_desc: "Prevents colonization anywhere in the subcontinent and stops its locations from growing or attracting migrants."

 # QoL (qol) Tab
 fum__qol_name: "QoL"
 ## Speeds (speeds) Group
 fum__qol__speeds_name: "Speeds"
 fum__army_movement_speed_name: "Army Movement Speed"
 fum__army_movement_speed_desc: "Changes army movement speed. 0% is vanilla."
 fum__army_movement_speed_format: "[CMMV('fum__army_movement_speed')]%"
 fum__navy_movement_speed_name: "Navy Movement Speed"
 fum__navy_movement_speed_desc: "Changes navy movement speed. 0% is vanilla. "
 fum__navy_movement_speed_format: "[CMMV('fum__navy_movement_speed')]%"
 fum__battle_length_name: "Battle Length"
 fum__battle_length_desc: "Determines how long battles will last. "
 fum__battle_length_option_1_name: "Vanilla"
 fum__battle_length_option_1_desc: "Battles will last the same amount of time as vanilla."
 fum__battle_length_option_2_name: "2x Faster"
 fum__battle_length_option_2_desc: "Battles will last half the time as the default setting."
 fum__battle_length_option_3_name: "Default"
 fum__battle_length_option_3_desc: "The mod's default recommended setting. Battles will last 3.91x longer, but losses/outcomes will be identical to vanilla."
 fum__battle_length_option_4_name: "2x Slower"
 fum__battle_length_option_4_desc: "Battles will last twice as long as the default setting."

