 fum__battle_length: "fum__battle_length"
 fum__character_culling_name: "人物の削除を有効にする"
 fum__character_culling_desc: "パフォーマンス向上のため、定期的に各国の最も能力の低い成人キャラクターを削除します。子供、王室財産内のキャラクター、内閣のメンバー、将軍、提督、および特殊な特性を持つキャラクターは保護されます。"
 fum__max_characters_per_nation_name: "国家あたりの最大人物数"
 fum__max_characters_per_nation_desc: "各国が保持できる成人キャラクターの最大数です。4年ごとに、能力値の低い順に超過した成人が削除されます。"
 fum__max_characters_per_nation_format: "[CMMV('fum__max_characters_per_nation')]"
 fum__character_culling: "fum__character_culling"
 fum__max_characters_per_nation: "fum__max_characters_per_nation"
 fum__common_name: "一般"
 fum__common__removals_name: "削除"
 fum__sop_removal_text: "適用"
 fum__common__character_culling_name: "人物の削除"
 fum__world_reduction_name: "世界の削減"
 fum__world_reduction__general_name: "全般"
 fum__reduction_preset_name: "プリセット"
 fum__reduction_preset_desc: "下記のオプション一式を選択します。いずれかを変更すると「カスタム」に切り替わります。"
 fum__reduction_preset_option_1_name: "カスタム"
 fum__reduction_preset_option_1_desc: "すべてのオプションをオフにします。"
 fum__reduction_preset_option_2_name: "低負荷"
 fum__reduction_preset_option_2_desc: "$north_america$、$south_america$、$australasia$、$pacific_islands$、$central_africa$、$southern_africa$の国々を削除してその住民を統合します。$north_asia$、$west_africa$、$east_africa$の住民を統合します。"
 fum__reduction_preset_option_3_name: "欧州中心"
 fum__reduction_preset_option_3_desc: "$east_asia$、$south_asia$、$south_east_asia$、$australasia$、$pacific_islands$の国家とPOPを削除し、そこへの入植を禁止します。$north_asia$の国家とPOPを削除します。$north_america$、$south_america$、$central_africa$、$southern_africa$の国家を削除し、それらのPOPを統合します。$west_africa$と$east_africa$のPOPを統合します。"
 fum__reduction_preset_option_4_name: "アジア中心"
 fum__reduction_preset_option_4_desc: "$western_europe$、$eastern_europe$、$north_america$、$south_america$の国家とPOPを削除し、そこでの植民を禁止します。$north_africa$、$west_africa$、$central_africa$の国家を削除し、それらのPOPを統合します。"
 fum__apply_world_reduction_name: "世界削減を適用"
 fum__apply_world_reduction_desc: "選択されたすべてのオプションをその亜大陸に適用します。$caucasus_region$、$steppes_region$、および$egypt_region$リージョンは常に保持されます。"
 fum__apply_world_reduction_text: "適用"
 fum_txt_subcontinent: "亜大陸"
 fum_txt_remove_countries_name: "国家の削除"
 fum_txt_remove_countries_desc: "亜大陸内のすべての国家を削除します。それらの部隊と建物は破壊され、その土地は未所有になります。どこであっても国家を削除すると「大疫病」が終結し、$east_asia$と$south_asia$の両方の国家を削除すると、1390年からそれらに隣接する自国のロケーションに「能力主義」が伝播します。"
 fum_txt_merge_pops_name: "ポップの統合"
 fum_txt_merge_pops_desc: "亜大陸の各リージョンにおけるすべてのPOPを、そのリージョン内で最大の文化および宗教に変換します。そのリージョンに首都を置く国家とすべてのキャラクターも、併せて変換されます。人口は変更されません。"
 fum_txt_remove_pops_name: "POPを削除"
 fum_txt_remove_pops_desc: "上記のようにPOPを統合し、すべての立地を人口10人の未開発な地方入植地として残します。"
 fum_txt_block_colonization_name: "植民の禁止"
 fum_txt_block_colonization_desc: "亜大陸内におけるあらゆる植民を禁止し、そのロケーションの成長および移民の流入を停止させます。"
