 fum__navy_movement_speed: "fum__navy_movement_speed"
 fum__battle_length: "fum__battle_length"
 fum__performance__character_culling_name: "キャラクターのカリング"
 fum__character_culling_name: "キャラクターのカリングを有効にする"
 fum__character_culling_desc: "パフォーマンス向上のため、各国からステータスの最も低い成人キャラクターを定期的に削除します。子供、王領のキャラクター、閣僚、将軍、提督、および特殊な特性を持つ者は保護されます。"
 fum__max_characters_per_nation_name: "国家あたりの最大人物数"
 fum__max_characters_per_nation_desc: "各国家が保持できる成人キャラクターの最大数。4年ごとに、能力値の低い超過した成人が削除されます。子供は対象外です。"
 fum__max_characters_per_nation_format: "[CMMV('fum__max_characters_per_nation')]"
 fum__performance__character_culling: "fum__performance__character_culling"
 fum__character_culling: "fum__character_culling"
 fum__max_characters_per_nation: "fum__max_characters_per_nation"
