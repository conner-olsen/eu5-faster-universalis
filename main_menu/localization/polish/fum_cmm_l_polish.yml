 fum__performance__character_culling_name: "Usuwanie postaci"
 fum__character_culling_name: "Włącz usuwanie postaci"
 fum__character_culling_desc: "Okresowo usuwa dorosłe postacie o najniższych statystykach z każdego państwa, aby poprawić wydajność. Dzieci, postacie w domenie koronnej, ministrowie, generałowie, admirałowie oraz osoby ze specjalnymi cechami są chronione."
 fum__max_characters_per_nation_name: "Maksymalna liczba postaci na państwo"
 fum__max_characters_per_nation_desc: "Maksymalna liczba dorosłych postaci, jaką może posiadać każde państwo. Nadmiar dorosłych o najniższych statystykach jest usuwany co 4 lata. Dzieci są wyłączone."
