 fum__character_culling_name: "Włącz usuwanie postaci"
 fum__character_culling_desc: "Okresowo usuwa dorosłe postacie o najniższych statystykach z każdego państwa, aby poprawić wydajność. Dzieci, postacie w domenie koronnej, członkowie gabinetu, generałowie, admirałowie oraz osoby ze specjalnymi cechami są chronione."
 fum__max_characters_per_nation_name: "Maksymalna liczba postaci na państwo"
 fum__max_characters_per_nation_desc: "Maksymalna liczba dorosłych postaci, jaką może posiadać każdy kraj. Nadmiarowi dorośli o najniższych statystykach są usuwani co 4 lata."
 fum__max_characters_per_nation_format: "[CMMV('fum__max_characters_per_nation')]"
 fum__character_culling: "fum__character_culling"
 fum__max_characters_per_nation: "fum__max_characters_per_nation"
 fum__common_name: "Ogólne"
 fum__common__removals_name: "Usunięcia"
 fum__sop_removal_text: "Zastosuj"
 fum__common__character_culling_name: "Usuwanie postaci"
 fum__world_reduction_name: "Redukcja świata"
 fum__world_reduction__general_name: "Ogólne"
 fum__reduction_preset_name: "Ustawienie wstępne"
 fum__reduction_preset_desc: "Zaznacza zestaw opcji poniżej. Zmiana którejkolwiek z nich przełącza to na Niestandardowe."
 fum__reduction_preset_option_1_name: "Własne"
 fum__reduction_preset_option_1_desc: "Wyłącza wszystkie opcje."
 fum__reduction_preset_option_2_name: "Niski wpływ"
 fum__reduction_preset_option_2_desc: "Usuwa państwa $north_america$, $south_america$, $australasia$, $pacific_islands$, $central_africa$ oraz $southern_africa$ i łączy ich populacje. Łączy populacje $north_asia$, $west_africa$ oraz $east_africa$."
 fum__reduction_preset_option_3_name: "Europocentryczne"
 fum__reduction_preset_option_3_desc: "Usuwa państwa i populację $east_asia$, $south_asia$, $south_east_asia$, $australasia$ oraz $pacific_islands$ i blokuje tam kolonizację. Usuwa państwa i populację $north_asia$. Usuwa państwa $north_america$, $south_america$, $central_africa$ oraz $southern_africa$ i łączy ich populację. Łączy populację $west_africa$ oraz $east_africa$."
 fum__reduction_preset_option_4_name: "Azjacentryczny"
 fum__reduction_preset_option_4_desc: "Usuwa państwa i populację $western_europe$, $eastern_europe$, $north_america$ oraz $south_america$ i blokuje tam kolonizację. Usuwa państwa $north_africa$, $west_africa$ oraz $central_africa$ i scala ich populację."
 fum__apply_world_reduction_name: "Zastosuj redukcję świata"
 fum__apply_world_reduction_desc: "Stosuje każdą zaznaczoną opcję do jej podkontynentu. Regiony $caucasus_region$, $steppes_region$ i $egypt_region$ są zawsze zachowywane."
 fum__apply_world_reduction_text: "Zastosuj"
 fum_txt_subcontinent: "Subkontynent"
 fum_txt_remove_countries_name: "Usuń państwa"
 fum_txt_remove_countries_desc: "Usuwa każde państwo na subkontynencie. Ich jednostki i budynki zostają zniszczone, a ich ziemia staje się nieposiadana. Usunięcie państw w dowolnym miejscu kończy Wielką Zarazę, a usunięcie tych zarówno z $east_asia$, jak i $south_asia$ rozprzestrzenia merytokrację do twoich lokacji graniczących z nimi od 1390 roku."
 fum_txt_merge_pops_name: "Scal popy"
 fum_txt_merge_pops_desc: "Konwertuje każdą populację w każdym z regionów subkontynentu na dominującą kulturę i religię danego regionu. Państwa mające stolicę w tym regionie, wraz ze wszystkimi swoimi postaciami, zostają skonwertowane wraz z nimi. Wielkość populacji pozostaje niezmieniona."
 fum_txt_remove_pops_name: "Usuń populację"
 fum_txt_remove_pops_desc: "Łączy popy zgodnie z powyższym, a następnie pozostawia każdą lokację jako niezagospodarowaną osadę wiejską liczącą 10 osób."
 fum_txt_block_colonization_name: "Zablokuj kolonizację"
 fum_txt_block_colonization_desc: "Uniemożliwia kolonizację w dowolnym miejscu na subkontynencie oraz wstrzymuje wzrost tutejszych lokacji i przyciąganie migrantów."
