 fum__army_movement_speed: "fum__army_movement_speed"
 fum__navy_movement_speed: "fum__navy_movement_speed"
 fum__battle_length: "fum__battle_length"
 fum__performance__character_culling_name: "Charakterentfernung"
 fum__character_culling_name: "Charakterentfernung aktivieren"
 fum__character_culling_desc: "Entfernt periodisch die erwachsenen Charaktere mit den niedrigsten Werten aus jeder Nation, um die Performance zu verbessern. Kinder, Charaktere im Kronbesitz, Kabinettsmitglieder, Generäle, Admiräle und jene mit speziellen Merkmalen sind geschützt."
 fum__max_characters_per_nation_name: "Max. Charaktere pro Nation"
 fum__max_characters_per_nation_desc: "Die maximale Anzahl an erwachsenen Charakteren, die jede Nation haben kann. Überschüssige Erwachsene mit den niedrigsten Werten werden alle 4 Jahre entfernt."
 fum__max_characters_per_nation_format: "[CMMV('fum__max_characters_per_nation')]"
 fum__performance__character_culling: "fum__performance__character_culling"
 fum__character_culling: "fum__character_culling"
 fum__max_characters_per_nation: "fum__max_characters_per_nation"
