 fum__battle_length: "fum__battle_length"
 fum__character_culling_name: "Charakterentfernung aktivieren"
 fum__character_culling_desc: "Entfernt periodisch die erwachsenen Charaktere mit den niedrigsten Werten aus jeder Nation, um die Performance zu verbessern. Kinder, Charaktere im Kronbesitz, Kabinettsmitglieder, Generäle, Admiräle und jene mit speziellen Merkmalen sind geschützt."
 fum__max_characters_per_nation_name: "Max. Charaktere pro Nation"
 fum__max_characters_per_nation_desc: "Die maximale Anzahl an erwachsenen Charakteren, die jede Nation haben kann. Überschüssige Erwachsene mit den niedrigsten Werten werden alle 4 Jahre entfernt."
 fum__max_characters_per_nation_format: "[CMMV('fum__max_characters_per_nation')]"
 fum__character_culling: "fum__character_culling"
 fum__max_characters_per_nation: "fum__max_characters_per_nation"
 fum__common_name: "Allgemein"
 fum__common__removals_name: "Entfernungen"
 fum__sop_removal_text: "Anwenden"
 fum__common__character_culling_name: "Charakterentfernung"
 fum__world_reduction_name: "Weltreduzierung"
 fum__world_reduction__general_name: "Allgemein"
 fum__reduction_preset_name: "Voreinstellung"
 fum__reduction_preset_desc: "Aktiviert eine Auswahl an unten stehenden Optionen. Das Ändern einer dieser Optionen setzt dies auf Benutzerdefiniert."
 fum__reduction_preset_option_1_name: "Benutzerdefiniert"
 fum__reduction_preset_option_1_desc: "Deaktiviert alle Optionen."
 fum__reduction_preset_option_2_name: "Geringe Auswirkung"
 fum__reduction_preset_option_2_desc: "Entfernt die Länder $north_america$, $south_america$, $australasia$, $pacific_islands$, $central_africa$ und $southern_africa$ und führt deren Pops zusammen. Führt die Pops von $north_asia$, $west_africa$ und $east_africa$ zusammen."
 fum__reduction_preset_option_3_name: "Europazentriert"
 fum__reduction_preset_option_3_desc: "Entfernt die Länder und Bevölkerung von $east_asia$, $south_asia$, $south_east_asia$, $australasia$ und $pacific_islands$ und blockiert dort die Kolonialisierung. Entfernt die Länder und Bevölkerung von $north_asia$. Entfernt die Länder von $north_america$, $south_america$, $central_africa$ und $southern_africa$ und führt deren Bevölkerung zusammen. Führt die Bevölkerung von $west_africa$ und $east_africa$ zusammen."
 fum__reduction_preset_option_4_name: "Asienzentriert"
 fum__reduction_preset_option_4_desc: "Entfernt die Länder und die Bevölkerung von $western_europe$, $eastern_europe$, $north_america$ und $south_america$ und blockiert dort die Kolonialisierung. Entfernt die Länder von $north_africa$, $west_africa$ und $central_africa$ und führt deren Bevölkerung zusammen."
 fum__apply_world_reduction_name: "Weltreduktion anwenden"
 fum__apply_world_reduction_desc: "Wendet jede markierte Option auf ihren Subkontinent an. Die Regionen $caucasus_region$, $steppes_region$ und $egypt_region$ werden immer beibehalten."
 fum__apply_world_reduction_text: "Anwenden"
 fum_txt_subcontinent: "Subkontinent"
 fum_txt_remove_countries_name: "Länder entfernen"
 fum_txt_remove_countries_desc: "Entfernt alle Länder im Subkontinent. Ihre Einheiten und Gebäude werden zerstört und ihr Land wird herrenlos. Das Entfernen von Ländern an beliebiger Stelle beendet die Große Pest, und das Entfernen jener in sowohl $east_asia$ als auch $south_asia$ verbreitet ab 1390 die Meritokratie in Euren an sie grenzenden Orten."
 fum_txt_merge_pops_name: "Pops zusammenlegen"
 fum_txt_merge_pops_desc: "Konvertiert jeden Pop in jeder Region des Subkontinents zur jeweils größten Kultur und Religion der Region. Länder mit ihrer Hauptstadt in der Region sowie all ihre Charaktere werden ebenfalls konvertiert. Die Bevölkerungszahl bleibt unverändert."
 fum_txt_remove_pops_name: "Pops entfernen"
 fum_txt_remove_pops_desc: "Führt Pops wie oben zusammen und hinterlässt jeden Ort als unentwickelte ländliche Siedlung mit 10 Einwohnern."
 fum_txt_block_colonization_name: "Kolonisierung blockieren"
 fum_txt_block_colonization_desc: "Verhindert die Kolonisierung im gesamten Subkontinent und unterbindet das Wachstum sowie den Zuzug von Migranten in dessen Standorten."
