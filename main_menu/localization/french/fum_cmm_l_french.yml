l_french:
 # Mod
 fum_name: "Faster Universalis"
 fum_desc: "Améliore les performances d'EU5 tout en préservant l'équilibrage, le gameplay et la qualité graphique du jeu de base."

 # Performance (performance) Tab
 fum__performance_name: "Performances"
 ## Removals (removals) Group
 fum__performance__removals_name: "Suppressions"
 fum__sop_removal_name: "Supprimer la Société des populations"
 fum__sop_removal_desc: "Supprime toutes les Sociétés de populations."
 fum__nation_removal_name: "Suppression des nations"
 fum__nation_removal_desc: "Supprime des nations en fonction du paramètre spécifié. Toute option autre que Aucune suppression mettra également fin à la Grande Peste."
 fum__nation_removal_option_1_name: "Aucune suppression"
 fum__nation_removal_option_1_desc: "Toutes les nations seront présentes dans le jeu."
 fum__nation_removal_option_2_name: "Nations à faible impact"
 fum__nation_removal_option_2_desc: "Supprime toutes les nations de ces sous-continents : Amérique du Nord, Amérique du Sud, Îles du Pacifique"
 fum__nation_removal_option_3_name: "Asie de l'Est"
 fum__nation_removal_option_3_desc: "Supprime toutes les nations du sous-continent d'Asie de l'Est."
 fum__nation_removal_option_4_name: "Centré sur l'Europe"
 fum__nation_removal_option_4_desc: "Supprime toutes les nations de ces sous-continents : Asie de l'Est, Asie du Sud, Asie du Sud-Est, Australasie, Îles du Pacifique, Amérique du Sud. La méritocratie se propagera toujours vers vos localisations limitrophes de l'Asie de l'Est et de l'Asie du Sud à partir de 1390."
 fum__block_recolonization_name: "Bloquer la recolonisation"
 fum__block_recolonization_desc: "Supprimera les pops et empêchera la recolonisation de tous les sous-continents désactivés lorsqu'utilisé avec les paramètres Asie de l'Est, Centré sur l'Europe ou Centré sur l'Asie. Ne bloquera pas la colonisation et ne supprimera pas les pops des sous-continents jamais colonisés, tels que l'Amérique du Sud."
 fum__pop_removal_name: "Supprimer les populations sans propriétaire"
 fum__pop_removal_desc: "Supprime les populations des lieux sans propriétaire. Améliore les performances, mais accélérera la colonisation car il n'y aura plus de populations locales. Se cumule avec la suppression des nations."
 fum__apply_performance_settings_name: "Appliquer les paramètres de performance"
 fum__apply_performance_settings_desc: "Appliquera tous les paramètres sélectionnés."
 fum__apply_performance_settings_text: "Appliquer"

 # QoL (qol) Tab
 fum__qol_name: "Qualité de vie"
 ## Speeds (speeds) Group
 fum__qol__speeds_name: "Vitesses"
 fum__army_movement_speed_name: "Vitesse de déplacement des armées"
 fum__army_movement_speed_desc: "Modifie la vitesse de déplacement des armées. 0 % correspond au jeu de base."
 fum__army_movement_speed_format: "[CMMV('fum__army_movement_speed')]%"
 fum__navy_movement_speed_name: "Vitesse de déplacement de la flotte"
 fum__navy_movement_speed_desc: "Modifie la vitesse de déplacement navale. 0 % correspond au jeu de base."
 fum__navy_movement_speed_format: "[CMMV('fum__navy_movement_speed')]%"
 fum__battle_length_name: "Durée de la bataille"
 fum__battle_length_desc: "Détermine la durée des batailles."
 fum__battle_length_option_1_name: "Vanilla"
 fum__battle_length_option_1_desc: "Les batailles auront la même durée que dans le jeu de base."
 fum__battle_length_option_2_name: "2x plus rapide"
 fum__battle_length_option_2_desc: "Les batailles dureront deux fois moins longtemps que dans la configuration par défaut."
 fum__battle_length_option_3_name: "Par défaut"
 fum__battle_length_option_3_desc: "Le réglage recommandé par défaut du mod. Les batailles dureront 3.91x plus longtemps, mais les pertes et les résultats seront identiques à la version vanilla."
 fum__battle_length_option_4_name: "2x plus lent"
 fum__battle_length_option_4_desc: "Les batailles dureront deux fois plus longtemps que le paramètre par défaut."

 # Other (other) Tab
 ## General (general) Group

 # Optional: self-referencing flag keys to suppress IDE warnings (safe to remove if you want)
 fum: "fum"
 fum__performance: "fum__performance"
 fum__qol: "fum__qol"
 fum__performance__removals: "fum__performance__removals"
 fum__qol__speeds: "fum__qol__speeds"
 fum__sop_removal: "fum__sop_removal"
 fum__nation_removal: "fum__nation_removal"
 fum__block_recolonization: "fum__block_recolonization"
 fum__pop_removal: "fum__pop_removal"
 fum__apply_performance_settings: "fum__apply_performance_settings"
 fum__army_movement_speed: "fum__army_movement_speed"
 fum__navy_movement_speed: "fum__navy_movement_speed"
 fum__battle_length: "fum__battle_length"
 fum__performance__character_culling_name: "Suppression de personnages"
 fum__character_culling_name: "Activer la suppression des personnages"
 fum__character_culling_desc: "Supprime périodiquement les personnages adultes ayant les statistiques les plus faibles de chaque nation afin d'améliorer les performances. Les enfants, les personnages du domaine royal, les membres du Cabinet, les généraux, les amiraux et ceux possédant des traits spéciaux sont protégés."
 fum__max_characters_per_nation_name: "Max personnages par nation"
 fum__max_characters_per_nation_desc: "Le nombre maximum de personnages adultes que chaque nation peut posséder. Les adultes en surplus ayant les statistiques les plus faibles sont supprimés tous les 4 ans."
 fum__max_characters_per_nation_format: "[CMMV('fum__max_characters_per_nation')]"
 fum__performance__character_culling: "fum__performance__character_culling"
 fum__character_culling: "fum__character_culling"
 fum__max_characters_per_nation: "fum__max_characters_per_nation"
 fum__nation_removal_option_5_name: "Centré sur l'Asie"
 fum__nation_removal_option_5_desc: "Supprime toutes les nations de ces sous-continents : Europe occidentale, Europe orientale, Afrique du Nord, Afrique de l'Ouest, Afrique centrale, Amérique du Nord, Amérique du Sud. Les régions du Caucase, de la steppe pontique et de l'Égypte sont conservées."
