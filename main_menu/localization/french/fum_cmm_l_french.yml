 fum__navy_movement_speed: "fum__navy_movement_speed"
 fum__battle_length: "fum__battle_length"
 fum__performance__character_culling_name: "Élagage des personnages"
 fum__character_culling_name: "Activer l'élimination des personnages"
 fum__character_culling_desc: "Supprime périodiquement les personnages adultes ayant les statistiques les plus faibles de chaque nation pour améliorer les performances. Les enfants, les personnages du domaine royal, les ministres du cabinet, les généraux, les amiraux et ceux possédant des traits spéciaux sont protégés."
 fum__max_characters_per_nation_name: "Max personnages par nation"
 fum__max_characters_per_nation_desc: "Le nombre maximum de personnages adultes que chaque nation peut avoir. Les adultes en surplus ayant les statistiques les plus basses sont retirés tous les 4 ans. Les enfants sont exemptés."
 fum__max_characters_per_nation_format: "[CMMV('fum__max_characters_per_nation')]"
 fum__performance__character_culling: "fum__performance__character_culling"
 fum__character_culling: "fum__character_culling"
 fum__max_characters_per_nation: "fum__max_characters_per_nation"
