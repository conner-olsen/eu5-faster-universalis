 fum__battle_length: "fum__battle_length"
 fum__character_culling_name: "Activer la suppression des personnages"
 fum__character_culling_desc: "Supprime périodiquement les personnages adultes ayant les statistiques les plus faibles de chaque nation afin d'améliorer les performances. Les enfants, les personnages du domaine royal, les membres du Cabinet, les généraux, les amiraux et ceux possédant des traits spéciaux sont protégés."
 fum__max_characters_per_nation_name: "Max personnages par nation"
 fum__max_characters_per_nation_desc: "Le nombre maximum de personnages adultes que chaque nation peut posséder. Les adultes en surplus ayant les statistiques les plus faibles sont supprimés tous les 4 ans."
 fum__max_characters_per_nation_format: "[CMMV('fum__max_characters_per_nation')]"
 fum__character_culling: "fum__character_culling"
 fum__max_characters_per_nation: "fum__max_characters_per_nation"
 fum__common_name: "Commun"
 fum__common__removals_name: "Suppressions"
 fum__sop_removal_text: "Appliquer"
 fum__common__character_culling_name: "Suppression des personnages"
 fum__world_reduction_name: "Réduction du monde"
 fum__world_reduction__general_name: "Général"
 fum__reduction_preset_name: "Préréglage"
 fum__reduction_preset_desc: "Coche un ensemble d'options ci-dessous. En modifier une seule fait basculer ce réglage sur Personnalisé."
 fum__reduction_preset_option_1_name: "Personnalisé"
 fum__reduction_preset_option_1_desc: "Désactive toutes les options."
 fum__reduction_preset_option_2_name: "Impact faible"
 fum__reduction_preset_option_2_desc: "Supprime les pays de $north_america$, $south_america$, $australasia$, $pacific_islands$, $central_africa$ et $southern_africa$ et fusionne leurs populations. Fusionne les populations de $north_asia$, $west_africa$ et $east_africa$."
 fum__reduction_preset_option_3_name: "Centré sur l'Europe"
 fum__reduction_preset_option_3_desc: "Supprime les pays et les populations de $east_asia$, $south_asia$, $south_east_asia$, $australasia$ et $pacific_islands$ et y bloque la colonisation. Supprime les pays et les populations de $north_asia$. Supprime les pays de $north_america$, $south_america$, $central_africa$ et $southern_africa$ et fusionne leurs populations. Fusionne les populations de $west_africa$ et $east_africa$."
 fum__reduction_preset_option_4_name: "Centré sur l'Asie"
 fum__reduction_preset_option_4_desc: "Supprime les pays et les populations de $western_europe$, $eastern_europe$, $north_america$ et $south_america$ et y bloque la colonisation. Supprime les pays de $north_africa$, $west_africa$ et $central_africa$ et fusionne leurs populations."
 fum__apply_world_reduction_name: "Appliquer la réduction du monde"
 fum__apply_world_reduction_desc: "Applique chaque option cochée à son sous-continent. Les régions $caucasus_region$, $steppes_region$ et $egypt_region$ sont toujours conservées."
 fum__apply_world_reduction_text: "Appliquer"
 fum_txt_subcontinent: "Sous-continent"
 fum_txt_remove_countries_name: "Supprimer les pays"
 fum_txt_remove_countries_desc: "Supprime tous les pays du sous-continent. Leurs unités et bâtiments sont détruits et leurs terres deviennent sans propriétaire. Supprimer des pays n'importe où met fin à la Grande Peste, et supprimer ceux de $east_asia$ et de $south_asia$ propage la Méritocratie dans vos localités limitrophes à partir de 1390."
 fum_txt_merge_pops_name: "Fusionner les populations"
 fum_txt_merge_pops_desc: "Convertit chaque pop de chacune des régions du sous-continent à la culture et à la religion majoritaires de la région. Les pays ayant leur capitale dans la région, ainsi que tous leurs personnages, sont convertis avec elles. La population reste inchangée."
 fum_txt_remove_pops_name: "Supprimer les Pops"
 fum_txt_remove_pops_desc: "Fusionne les pops comme ci-dessus, puis laisse chaque lieu en tant qu'établissement rural non développé de 10 personnes."
 fum_txt_block_colonization_name: "Bloquer la colonisation"
 fum_txt_block_colonization_desc: "Empêche toute colonisation dans le sous-continent et empêche ses lieux de croître ou d'attirer des migrants."
