 fum__performance__character_culling_name: "캐릭터 컬링"
 fum__character_culling_name: "캐릭터 컬링 활성화"
 fum__character_culling_desc: "성능 향상을 위해 각 국가에서 능력치가 가장 낮은 성인 캐릭터들을 주기적으로 제거합니다. 어린이, 왕실 가문 소속 캐릭터, 내각 장관, 장군, 제독, 그리고 특별한 특성을 가진 캐릭터들은 보호됩니다."
 fum__max_characters_per_nation_name: "국가당 최대 인물 수"
 fum__max_characters_per_nation_desc: "각 국가가 보유할 수 있는 성인 캐릭터의 최대 수입니다. 4년마다 능력치가 가장 낮은 초과 성인들이 제거됩니다. 어린이는 제외됩니다."
 fum__max_characters_per_nation_format: "[CMMV('fum__max_characters_per_nation')]"
 fum__performance__character_culling: "fum__performance__character_culling"
 fum__character_culling: "fum__character_culling"
 fum__max_characters_per_nation: "fum__max_characters_per_nation"
