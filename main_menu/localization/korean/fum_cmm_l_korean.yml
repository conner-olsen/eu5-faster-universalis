l_korean:
 # Mod
 fum_name: "패스터 유니버설리스"
 fum_desc: "바닐라의 밸런스, 게임플레이, 그래픽 품질을 유지하면서 EU5 성능을 향상시킵니다."

 # Performance (performance) Tab
 ## Removals (removals) Group
 fum__sop_removal_name: "팝 사회 제거"
 fum__sop_removal_desc: "모든 팝 공동체를 제거합니다."

 # QoL (qol) Tab
 fum__qol_name: "편의성"
 ## Speeds (speeds) Group
 fum__qol__speeds_name: "속도"
 fum__army_movement_speed_name: "육군 이동 속도"
 fum__army_movement_speed_desc: "육군 이동 속도를 변경합니다. 0%가 바닐라 상태입니다."
 fum__army_movement_speed_format: "[CMMV('fum__army_movement_speed')]%"
 fum__navy_movement_speed_name: "해군 이동 속도"
 fum__navy_movement_speed_desc: "해군 이동 속도를 변경합니다. 0%가 바닐라 설정입니다."
 fum__navy_movement_speed_format: "[CMMV('fum__navy_movement_speed')]%"
 fum__battle_length_name: "전투 기간"
 fum__battle_length_desc: "전투가 얼마나 오래 지속될지를 결정합니다."
 fum__battle_length_option_1_name: "바닐라"
 fum__battle_length_option_1_desc: "전투는 바닐라와 동일한 시간 동안 지속됩니다."
 fum__battle_length_option_2_name: "2배 더 빠르게"
 fum__battle_length_option_2_desc: "전투가 기본 설정의 절반의 시간 동안 지속됩니다."
 fum__battle_length_option_3_name: "기본"
 fum__battle_length_option_3_desc: "모드의 기본 권장 설정입니다. 전투가 3.91배 더 오래 지속되지만, 손실 및 결과는 바닐라와 동일합니다."
 fum__battle_length_option_4_name: "2배 느림"
 fum__battle_length_option_4_desc: "전투가 기본 설정보다 두 배 더 오래 지속됩니다."

 # Other (other) Tab
 ## General (general) Group

 # Optional: self-referencing flag keys to suppress IDE warnings (safe to remove if you want)
 fum: "fum"
 fum__qol: "fum__qol"
 fum__qol__speeds: "fum__qol__speeds"
 fum__sop_removal: "fum__sop_removal"
 fum__army_movement_speed: "fum__army_movement_speed"
 fum__navy_movement_speed: "fum__navy_movement_speed"
 fum__battle_length: "fum__battle_length"
 fum__character_culling_name: "캐릭터 제거 활성화"
 fum__character_culling_desc: "성능 향상을 위해 각 국가에서 능력치가 가장 낮은 성인 캐릭터를 주기적으로 제거합니다. 아동, 왕실 소속 캐릭터, 내각 일원, 장군, 제독 및 특수 특성을 가진 캐릭터는 보호됩니다."
 fum__max_characters_per_nation_name: "국가당 최대 인물 수"
 fum__max_characters_per_nation_desc: "각 국가가 보유할 수 있는 최대 성인 캐릭터 수입니다. 능력치가 가장 낮은 초과 인원은 4년마다 제거됩니다."
 fum__max_characters_per_nation_format: "[CMMV('fum__max_characters_per_nation')]"
 fum__character_culling: "fum__character_culling"
 fum__max_characters_per_nation: "fum__max_characters_per_nation"
 fum__common_name: "일반"
 fum__common__removals_name: "제거"
 fum__sop_removal_text: "적용"
 fum__common__character_culling_name: "인물 제거"
 fum__world_reduction_name: "세계 축소"
 fum__world_reduction__general_name: "일반"
 fum__reduction_preset_name: "사전 설정"
 fum__reduction_preset_desc: "아래의 일련의 옵션들을 선택합니다. 이 중 하나라도 변경하면 '사용자 지정'으로 전환됩니다."
 fum__reduction_preset_option_1_name: "사용자 설정"
 fum__reduction_preset_option_1_desc: "모든 옵션을 끕니다."
 fum__reduction_preset_option_2_name: "낮은 영향"
 fum__reduction_preset_option_2_desc: "$north_america$, $south_america$, $australasia$, $pacific_islands$, $central_africa$ 및 $southern_africa$ 국가를 제거하고 해당 인구를 통합합니다. $north_asia$, $west_africa$ 및 $east_africa$의 인구를 통합합니다."
 fum__reduction_preset_option_3_name: "유럽 중심"
 fum__reduction_preset_option_3_desc: "$east_asia$, $south_asia$, $south_east_asia$, $australasia$, $pacific_islands$의 국가와 인구를 제거하고 해당 지역의 식민지 개척을 차단합니다. $north_asia$의 국가와 인구를 제거합니다. $north_america$, $south_america$, $central_africa$, $southern_africa$의 국가를 제거하고 인구를 통합합니다. $west_africa$와 $east_africa$의 인구를 통합합니다."
 fum__reduction_preset_option_4_name: "아시아 중심"
 fum__reduction_preset_option_4_desc: "$western_europe$, $eastern_europe$, $north_america$ 및 $south_america$의 국가와 팝을 제거하고 해당 지역의 식민지 개척을 차단합니다. $north_africa$, $west_africa$ 및 $central_africa$의 국가를 제거하고 팝을 통합합니다."
 fum__apply_world_reduction_name: "세계 축소 적용"
 fum__apply_world_reduction_desc: "체크된 모든 옵션을 해당 아대륙에 적용합니다. $caucasus_region$, $steppes_region$, $egypt_region$ 권역은 항상 유지됩니다."
 fum__apply_world_reduction_text: "적용"
 fum_txt_subcontinent: "아대륙"
 fum_txt_remove_countries_name: "국가 제거"
 fum_txt_remove_countries_desc: "아대륙 내 모든 국가를 제거합니다. 해당 국가들의 부대와 건물은 파괴되고 영토는 소유주가 없는 상태가 됩니다. 어디에서든 국가를 제거하면 대역병이 종식되며, $east_asia$와 $south_asia$ 양쪽의 국가를 모두 제거하면 1390년부터 이들과 접경한 귀하의 지역에 능력주의가 전파됩니다."
 fum_txt_merge_pops_name: "팝 통합"
 fum_txt_merge_pops_desc: "아대륙 내 각 지역의 모든 팝을 해당 지역에서 가장 규모가 큰 문화와 종교로 변환합니다. 해당 지역에 수도를 둔 국가와 소속된 모든 인물도 함께 변환됩니다. 인구수는 변경되지 않습니다."
 fum_txt_remove_pops_name: "팝 제거"
 fum_txt_remove_pops_desc: "위와 같이 팝을 통합하고, 모든 지역을 인구 10명의 개발되지 않은 농촌 정착지 상태로 남깁니다."
 fum_txt_block_colonization_name: "식민지화 차단"
 fum_txt_block_colonization_desc: "아대륙 내 어디에서도 개척을 방지하며, 소속 거점의 성장을 멈추고 이주민 유입을 차단합니다."
