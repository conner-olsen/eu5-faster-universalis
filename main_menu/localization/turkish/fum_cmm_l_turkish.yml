 fum__character_culling_name: "Karakter Kaldırmayı Etkinleştir"
 fum__character_culling_desc: "Performansı artırmak amacıyla her ülkeden en düşük özelliklere sahip yetişkin karakterleri periyodik olarak kaldırır. Çocuklar, hanedan mülkündeki karakterler, Kabine Üyeleri, generaller, amiraller ve özel niteliklere sahip olanlar korunur."
 fum__max_characters_per_nation_name: "Ulus Başına Maksimum Karakter"
 fum__max_characters_per_nation_desc: "Her ulusun sahip olabileceği maksimum yetişkin karakter sayısı. En düşük özelliklere sahip fazla yetişkinler her 4 yılda bir kaldırılır."
 fum__max_characters_per_nation_format: "[CMMV('fum__max_characters_per_nation')]"
 fum__character_culling: "fum__character_culling"
 fum__max_characters_per_nation: "fum__max_characters_per_nation"
 fum__common_name: "Genel"
 fum__common__removals_name: "Kaldırılanlar"
 fum__sop_removal_text: "Uygula"
 fum__common__character_culling_name: "Karakter Kaldırma"
 fum__world_reduction_name: "Dünya Azaltması"
 fum__world_reduction__general_name: "General"
 fum__reduction_preset_name: "Önayar"
 fum__reduction_preset_desc: "Aşağıdaki seçenekleri işaretler. Herhangi birini değiştirmek bunu Özel'e çevirir."
 fum__reduction_preset_option_1_name: "Özel"
 fum__reduction_preset_option_1_desc: "Tüm seçenekleri kapatır."
 fum__reduction_preset_option_2_name: "Düşük Etki"
 fum__reduction_preset_option_2_desc: "$north_america$, $south_america$, $australasia$, $pacific_islands$, $central_africa$ ve $southern_africa$ ülkelerini kaldırır ve poplarını birleştirir. $north_asia$, $west_africa$ ve $east_africa$ poplarını birleştirir."
 fum__reduction_preset_option_3_name: "Avrupa Odaklı"
 fum__reduction_preset_option_3_desc: "$east_asia$, $south_asia$, $south_east_asia$, $australasia$ ve $pacific_islands$ ülkelerini ve nüfuslarını kaldırır ve buralarda sömürgeleştirmeyi engeller. $north_asia$ ülkelerini ve nüfuslarını kaldırır. $north_america$, $south_america$, $central_africa$ ve $southern_africa$ ülkelerini kaldırır ve nüfuslarını birleştirir. $west_africa$ ve $east_africa$ nüfuslarını birleştirir."
 fum__reduction_preset_option_4_name: "Asya Odaklı"
 fum__reduction_preset_option_4_desc: "$western_europe$, $eastern_europe$, $north_america$ ve $south_america$ ülkelerini ve nüfuslarını kaldırır ve buralarda kolonileşmeyi engeller. $north_africa$, $west_africa$ ve $central_africa$ ülkelerini kaldırır ve nüfuslarını birleştirir."
 fum__apply_world_reduction_name: "Dünya İndirgemesini Uygula"
 fum__apply_world_reduction_desc: "İşaretlenen her seçeneği ilgili alt kıtasına uygular. $caucasus_region$, $steppes_region$ ve $egypt_region$ bölgeleri her zaman korunur."
 fum__apply_world_reduction_text: "Uygula"
 fum_txt_subcontinent: "Alt Kıta"
 fum_txt_remove_countries_name: "Ülkeleri Kaldır"
 fum_txt_remove_countries_desc: "Alt kıtadaki tüm ülkeleri kaldırır. Birimleri ve binaları yok edilir ve toprakları sahipsiz hale gelir. Herhangi bir yerdeki ülkeleri kaldırmak Büyük Veba'yı sona erdirir ve hem $east_asia$ hem de $south_asia$ ülkelerini kaldırmak, 1390'dan itibaren onlarla komşu olan konumlarınıza Meritokrasi yayar."
 fum_txt_merge_pops_name: "Nüfusları Birleştir"
 fum_txt_merge_pops_desc: "Alt kıtanın her bölgesindeki her popu, bölgenin en büyük kültürüne ve dinine dönüştürür. Başkenti bölgede olan ülkeler ve tüm karakterleri de onlarla birlikte dönüştürülür. Nüfus miktarı değişmez."
 fum_txt_remove_pops_name: "Nüfusları Kaldır"
 fum_txt_remove_pops_desc: "Nüfusları yukarıdaki gibi birleştirir, ardından her konumu 10 kişilik, gelişmemiş bir Kırsal Yerleşim olarak bırakır."
 fum_txt_block_colonization_name: "Kolonileşmeyi Engelle"
 fum_txt_block_colonization_desc: "Alt kıtanın hiçbir yerinde kolonizasyonu önler ve konumlarının büyümesini veya göçmen çekmesini durdurur."
