 fum__performance__character_culling_name: "Karakter Ayıklama"
 fum__character_culling_name: "Karakter Ayıklamayı Etkinleştir"
 fum__character_culling_desc: "Performansı artırmak için her ülkedeki en düşük istatistikli yetişkin karakterleri periyodik olarak kaldırır. Çocuklar, hanedan mülkündeki karakterler, kabine bakanları, generaller, amiraller ve özel niteliklere sahip olanlar korunur."
 fum__max_characters_per_nation_name: "Ulus Başına Maksimum Karakter"
 fum__max_characters_per_nation_desc: "Her ülkenin sahip olabileceği maksimum yetişkin karakter sayısı. En düşük özelliklere sahip fazla yetişkinler her 4 yılda bir silinir. Çocuklar muaftır."
 fum__max_characters_per_nation_format: "[CMMV('fum__max_characters_per_nation')]"
