 fum__performance__character_culling_name: "Удаление персонажей"
 fum__character_culling_name: "Включить удаление персонажей"
 fum__character_culling_desc: "Периодически удаляет взрослых персонажей с самыми низкими характеристиками в каждой стране для повышения производительности. Дети, персонажи в коронных владениях, члены кабинета, генералы, адмиралы и обладатели особых черт защищены."
 fum__max_characters_per_nation_name: "Макс. персонажей на страну"
 fum__max_characters_per_nation_desc: "Максимальное количество взрослых персонажей для каждой страны. Лишние персонажи с самыми низкими характеристиками удаляются каждые 4 года."
 fum__max_characters_per_nation_format: "[CMMV('fum__max_characters_per_nation')]"
 fum__performance__character_culling: "fum__performance__character_culling"
 fum__character_culling: "fum__character_culling"
 fum__max_characters_per_nation: "fum__max_characters_per_nation"
