 fum__battle_length: "fum__battle_length"
 fum__character_culling_name: "Включить удаление персонажей"
 fum__character_culling_desc: "Периодически удаляет взрослых персонажей с самыми низкими характеристиками в каждой стране для повышения производительности. Дети, персонажи в коронных владениях, члены кабинета, генералы, адмиралы и обладатели особых черт защищены."
 fum__max_characters_per_nation_name: "Макс. персонажей на страну"
 fum__max_characters_per_nation_desc: "Максимальное количество взрослых персонажей для каждой страны. Лишние персонажи с самыми низкими характеристиками удаляются каждые 4 года."
 fum__max_characters_per_nation_format: "[CMMV('fum__max_characters_per_nation')]"
 fum__character_culling: "fum__character_culling"
 fum__max_characters_per_nation: "fum__max_characters_per_nation"
 fum__common_name: "Общее"
 fum__common__removals_name: "Удаления"
 fum__sop_removal_text: "Применить"
 fum__common__character_culling_name: "Удаление персонажей"
 fum__world_reduction_name: "Сокращение мира"
 fum__world_reduction__general_name: "Общие"
 fum__reduction_preset_name: "Предустановка"
 fum__reduction_preset_desc: "Отмечает набор параметров ниже. Изменение любого из них переключает этот режим на «Пользовательский»."
 fum__reduction_preset_option_1_name: "Пользовательский"
 fum__reduction_preset_option_1_desc: "Отключает все опции."
 fum__reduction_preset_option_2_name: "Низкое влияние"
 fum__reduction_preset_option_2_desc: "Удаляет страны $north_america$, $south_america$, $australasia$, $pacific_islands$, $central_africa$ и $southern_africa$ и объединяет их население. Объединяет население $north_asia$, $west_africa$ и $east_africa$."
 fum__reduction_preset_option_3_name: "Европоцентричный"
 fum__reduction_preset_option_3_desc: "Удаляет страны и население $east_asia$, $south_asia$, $south_east_asia$, $australasia$ и $pacific_islands$ и блокирует там колонизацию. Удаляет страны и население $north_asia$. Удаляет страны $north_america$, $south_america$, $central_africa$ и $southern_africa$ и объединяет их население. Объединяет население $west_africa$ и $east_africa$."
 fum__reduction_preset_option_4_name: "Азиацентричный"
 fum__reduction_preset_option_4_desc: "Удаляет страны и население $western_europe$, $eastern_europe$, $north_america$ и $south_america$ и блокирует там колонизацию. Удаляет страны $north_africa$, $west_africa$ и $central_africa$ и объединяет их население."
 fum__apply_world_reduction_name: "Применить сокращение мира"
 fum__apply_world_reduction_desc: "Применяет каждую отмеченную опцию к её субконтиненту. Регионы $caucasus_region$, $steppes_region$ и $egypt_region$ всегда сохраняются."
 fum__apply_world_reduction_text: "Применить"
 fum_txt_subcontinent: "Субконтинент"
 fum_txt_remove_countries_name: "Удалить страны"
 fum_txt_remove_countries_desc: "Удаляет все страны в субконтиненте. Их войска и постройки уничтожаются, а их земли становятся ничейными. Удаление стран в любом месте прекращает Великий мор, а удаление стран в $east_asia$ и $south_asia$ распространяет меритократию в ваши локации, граничащие с ними, с 1390 года."
 fum_txt_merge_pops_name: "Слияние попов"
 fum_txt_merge_pops_desc: "Преобразует всех попов во всех регионах субконтинента в крупнейшую культуру и религию региона. Страны со столицей в регионе и все их персонажи преобразуются вместе с ними. Численность населения не меняется."
 fum_txt_remove_pops_name: "Удалить население"
 fum_txt_remove_pops_desc: "Объединяет население, как указано выше, затем оставляет каждую локацию неразвитым сельским поселением численностью 10 человек."
 fum_txt_block_colonization_name: "Блокировка колонизации"
 fum_txt_block_colonization_desc: "Предотвращает колонизацию на всей территории субконтинента и останавливает рост его локаций, а также привлечение мигрантов."
